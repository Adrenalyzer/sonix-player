name: Build firmware

# Run by hand from the Actions tab ("Run workflow"). Builds the player for the
# HiBy R1 with sonix-changes.patch applied (if that file is in the repo's top
# folder) and packs it into r1.upt, which you download from the run's page.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Apply the patch
        run: |
          if [ -f sonix-changes.patch ]; then
            git apply --check sonix-changes.patch
            git apply sonix-changes.patch
            git status --short | head -40
          else
            echo "No sonix-changes.patch in the top folder: building the code as it is."
          fi

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl texinfo bison flex \
            libgmp-dev libmpfr-dev libmpc-dev libncurses-dev zlib1g-dev \
            autoconf automake libtool libtool-bin bzip2 gzip pkg-config python3 perl patch xz-utils unzip rsync \
            p7zip-full squashfs-tools genisoimage

      # The MIPS compiler takes the longest to build, so it is kept between runs.
      - name: Restore the cached compiler
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: sonix-player/rockbox-toolchain
          key: toolchain-${{ hashFiles('sonix-player/rockboxdev/**') }}

      - name: Build the MIPS compiler
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: sonix-player
        # The Makefile names this target by its full path, so it has to be given that way.
        run: make "$PWD/rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-gcc"

      - name: Save the compiler for next time
        if: success() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: sonix-player/rockbox-toolchain
          key: toolchain-${{ hashFiles('sonix-player/rockboxdev/**') }}

      - name: Build the player
        working-directory: sonix-player
        run: make target -j"$(nproc)"

      - name: Get the stock R1 firmware
        run: |
          git clone --depth 1 https://github.com/hiby-modding/hiby_os_crack.git /tmp/hiby_os_crack
          cp "/tmp/hiby_os_crack/r1/firmware/original/r1(v1.6).upt" sonix-packer/r1_original.upt
          ls -l sonix-packer/r1_original.upt

      - name: Pack the firmware
        working-directory: sonix-packer
        run: |
          cp ../sonix-player/sonix_player ../sonix-player/sonix_launch .
          chmod +x sonix_firmware_packer.sh
          ./sonix_firmware_packer.sh
          ls -l *.upt

      - name: Keep the results
        uses: actions/upload-artifact@v6
        with:
          name: sonix-r1-firmware
          path: |
            sonix-packer/r1.upt
            sonix-player/sonix_player
          if-no-files-found: error

      # Only runs when something above failed. The compiler build writes its real
      # error messages to log files, not to the console, so print the end of the
      # newest one here.
      - name: Show the compiler build log if something failed
        if: failure()
        run: |
          echo "Red step above = where it stopped."
          ls -t sonix-player/tmp/rbdev-build/*.log 2>/dev/null | head -3 || true
          newest=$(ls -t sonix-player/tmp/rbdev-build/*.log 2>/dev/null | head -1 || true)
          if [ -n "$newest" ]; then
            echo "=== end of $newest"
            tail -n 80 "$newest"
          else
            echo "No compiler build log found: the failure was in another step."
          fi
